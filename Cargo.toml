[package]
name = "tiled"
version = "0.13.0"
description = "A rust crate for loading maps created by the Tiled editor"
categories = ["game-development"]
keywords = ["gamedev", "tiled", "tmx", "map"]
repository = "https://github.com/mapeditor/rs-tiled"
readme = "README.md"
license = "MIT"
authors = ["Matthew Hall <matthew@quickbeam.me.uk>"]
edition = "2018"
include = ["src/**/*.rs", "README.md", "LICENSE", "CHANGELOG.md"]

[features]

[lib]
name = "tiled"
path = "src/lib.rs"

[[example]]
name = "example"
path = "examples/main.rs"

[[example]]
name = "sfml"
path = "examples/sfml/main.rs"

[[example]]
name = "ggez"
path = "examples/ggez/main.rs"

[dependencies]
xml-rs = { git = "https://github.com/Niashi24/xml-rs.git", branch = "no_std" }
hashbrown = { version = "0.15.2" }
portable-atomic-util = { version = "0.2.4", features = ["alloc"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
no_std_io2 = { version = "0.9.0", default-features = false, features = ["alloc"] }

#[dev-dependencies.sfml]
#version = "0.24.0"
#features = ["graphics"]
#
#[dev-dependencies.ggez]
#version = "0.9.3"
